services:
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /app
      OPENCLAW_STATE_DIR: /app/.openclaw
      OPENCLAW_CONFIG_PATH: /app/openclaw.json
      OPENCLAW_CONFIG_DIR: /app/.openclaw
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
      IMGBB_API_KEY: ${IMGBB_API_KEY}
      USER_PHONE: ${USER_PHONE:-+919760347653}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/app/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/app/.openclaw/workspace-astrologer
      - ${OPENCLAW_TAROT_WORKSPACE_DIR:-./app/whatsapp-support/workspace-tarot-reader}:/app/.openclaw/workspace-tarot-reader
      - ./skills/tarot:/app/.openclaw/skills/tarot:ro
      - ${OPENCLAW_PREVIEW_WORKSPACE_DIR:-./app/whatsapp-support/workspace-astrologer-preview}:/app/.openclaw/workspace-astrologer-preview
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    networks:
      - hans-ai-network
    init: true
    restart: unless-stopped
    command:
      [
        "pnpm",
        "exec",
        "openclaw",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /app
      OPENCLAW_STATE_DIR: /app/.openclaw
      OPENCLAW_CONFIG_PATH: /app/openclaw.json
      OPENCLAW_CONFIG_DIR: /app/.openclaw
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE}
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/app/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR}:/app/.openclaw/workspace-astrologer
      - ${OPENCLAW_TAROT_WORKSPACE_DIR:-./app/whatsapp-support/workspace-tarot-reader}:/app/.openclaw/workspace-tarot-reader
      - ./skills/tarot:/app/.openclaw/skills/tarot:ro
      - ${OPENCLAW_PREVIEW_WORKSPACE_DIR:-./app/whatsapp-support/workspace-astrologer-preview}:/app/.openclaw/workspace-astrologer-preview
    stdin_open: true
    tty: true
    networks:
      - hans-ai-network
    init: true
    entrypoint: ["pnpm", "exec", "openclaw"]

networks:
  hans-ai-network:
    external: true
    name: hans-ai-network
